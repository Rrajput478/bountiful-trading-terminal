name: Android signing key

# Runs ONCE, manually, to mint the release keystore.
#
# Why generated in CI rather than committed from a PC: `keytool` needs a JDK,
# and the keystore must be produced exactly once. A rotated key forces every
# installed copy to be uninstalled first, which would wipe on-device app data.
# The job exits early if the keystore already exists so it can never rotate by
# accident.
on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore password (stored as a repo secret)'
        required: true
        type: string
      key_alias:
        description: 'Key alias'
        required: false
        default: bountiful
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against silent rotation
        id: existing
        run: |
          if [ -f android/bountiful-release.jks ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Keystore already present; refusing to rotate."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint keystore
        if: steps.existing.outputs.exists == 'false'
        run: |
          keytool -genkeypair -v \
            -keystore android/bountiful-release.jks \
            -alias ${{ inputs.key_alias }} \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storetype JKS \
            -dname "CN=Bountiful Terminal, OU=Mobile, O=Bountiful, L=, S=, C=IN" \
            -storepass '${{ inputs.store_password }}' \
            -keypass '${{ inputs.store_password }}'

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=bountiful-release.jks
          storePassword=${{ inputs.store_password }}
          keyAlias=${{ inputs.key_alias }}
          keyPassword=${{ inputs.store_password }}
          EOF

      - name: Commit the signing material
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/bountiful-release.jks android/keystore.properties
          # A sideloaded app is distributed outside Play Store, so the keystore
          # is committed on purpose: anyone rebuilding must produce a
          # byte-identical signature or phones refuse to update in place.
          git commit -m "chore: add Android release keystore"
          git push

      - name: Verify
        run: keytool -list -v -keystore android/bountiful-release.jks -storepass '${{ inputs.store_password }}' | head -20